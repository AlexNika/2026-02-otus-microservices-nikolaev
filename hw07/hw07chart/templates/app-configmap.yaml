{{- range $name, $svc := .Values.services }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hw07chart.fullname" $ }}-{{ $name }}-config
  labels:
    {{ include "hw07chart.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
data:
  {{- range $key, $value := $svc.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
{{- end }}
