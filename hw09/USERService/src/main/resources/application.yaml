# yaml-language-server: $schema=https://json.schemastore.org/spring-configuration-metadata.json
spring:
  profiles:
    active: dev
  application:
    name: USERService
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL_USER_SERVICE:jdbc:postgresql://localhost:5432/hw07db_user_service}
    username: ${SPRING_DATASOURCE_USERNAME_USER_SERVICE:hw07user_user_service}
    password: ${SPRING_DATASOURCE_PASSWORD_USER_SERVICE:hw07pass_user_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT_USER_SERVICE:8000}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  file:
    name: ./logs/user-service.log
  config: classpath:logback-spring.xml
  level:
    root: INFO
    ru.otus.hw: DEBUG
    org.springframework.security: DEBUG
    ru.otus.hw.config.SecurityConfig: TRACE

app:
  simulation-errors-bypass-enabled: true
  security:
    jwt-secret-key: ${JWT_SECRET_KEY:}
    jwt-expiration-time: ${JWT_EXPIRATION_TIME:86400000}
    bcrypt-iterations: ${BCRYPT_STRENGTH:12}
  billing-service-url: ${BILLING_SERVICE_URL:http://localhost:8001}
  internal-api-key: ${INTERNAL_API_KEY}
