spring:
  profiles:
    active: dev
  application:
    name: WAREHOUSEService
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL_WAREHOUSE_SERVICE:jdbc:postgresql://localhost:5436/hw08db_warehouse_service}
    username: ${SPRING_DATASOURCE_USERNAME_WAREHOUSE_SERVICE:hw08user_warehouse_service}
    password: ${SPRING_DATASOURCE_PASSWORD_WAREHOUSE_SERVICE:hw08pass_warehouse_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT_WAREHOUSE_SERVICE:8004}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: ./logs/warehouse-service.log
  config: classpath:logback-spring.xml
  level:
    root: INFO
    ru.otus.hw: DEBUG
    org.hibernate.SQL: DEBUG

app:
  internal-api-key: ${INTERNAL_API_KEY}