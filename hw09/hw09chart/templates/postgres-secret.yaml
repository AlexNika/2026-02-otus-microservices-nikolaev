apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hw09chart.fullname" . }}-postgres-secret
  labels:
    {{ include "hw09chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $pg := .Values.postgres }}
  {{ $pg.passwordSecretKey }}: {{ $pg.password | quote }}
  {{- end }}
