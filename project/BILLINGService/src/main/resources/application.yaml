# yaml-language-server: $schema=https://json.schemastore.org/spring-configuration-metadata.json
spring:
  profiles:
    active: dev
    group:
      dev:
        - chaos-monkey
      k8s:
        - chaos-monkey
  application:
    name: BILLINGService
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL_BILLING_SERVICE:jdbc:postgresql://localhost:5433/fpdb_billing_service}
    username: ${SPRING_DATASOURCE_USERNAME_BILLING_SERVICE:fpuser_billing_service}
    password: ${SPRING_DATASOURCE_PASSWORD_BILLING_SERVICE:fppass_billing_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_ADDRESSES:localhost}
    port: 5672
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

server:
  port: ${SERVER_PORT_BILLING_SERVICE:8001}

management:
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    chaosmonkey:
      # Аннотация эндпоинта — @RestControllerEndpoint(enableByDefault = false),
      # поэтому без явного включения бин эндпоинта не создаётся вовсе.
      # (свойство access взаимоисключающе с enabled, поэтому только enabled)
      enabled: ${CHAOS_MONKEY_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,rabbitmq,chaosmonkey
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

chaos:
  monkey:
    enabled: ${CHAOS_MONKEY_ENABLED:false}
    watcher:
      controller: true
      rest-controller: true
    assaults:
      level: 1
      latency-active: false
      latency-range-start: 100
      latency-range-end: 500
      exceptions-active: false
      kill-application-active: false

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    ru.otus.hw: DEBUG
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

app:
  simulation-errors-bypass-enabled: true
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8006}
  security:
    jwt-secret-key: ${JWT_SECRET_KEY:}
  internal-api-key: ${INTERNAL_API_KEY}
  rabbitmq:
    consumer:
      exchange-name: users.events
      queue-name: billing.account-create.queue
      queue-type: classic
      routing-key: user.created
    producer:
      exchange-name: accounts.events
      routing-key: account.created
    notification:
      exchange-name: notifications.events
      routing-key: notification.event