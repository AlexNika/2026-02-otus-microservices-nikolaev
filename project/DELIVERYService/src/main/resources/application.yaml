spring:
  profiles:
    active: dev
    group:
      dev:
        - chaos-monkey
      k8s:
        - chaos-monkey
  application:
    name: DELIVERYService
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL_DELIVERY_SERVICE:jdbc:postgresql://localhost:5437/fpdb_delivery_service}
    username: ${SPRING_DATASOURCE_USERNAME_DELIVERY_SERVICE:fpuser_delivery_service}
    password: ${SPRING_DATASOURCE_PASSWORD_DELIVERY_SERVICE:fppass_delivery_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_ADDRESSES:localhost}
    port: 5672
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

server:
  port: ${SERVER_PORT_DELIVERY_SERVICE:8005}

management:
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    chaosmonkey:
      enabled: ${CHAOS_MONKEY_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,rabbitmq,chaosmonkey
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

chaos:
  monkey:
    enabled: ${CHAOS_MONKEY_ENABLED:false}
    watcher:
      controller: true
      rest-controller: true
    assaults:
      level: 1
      latency-active: false
      latency-range-start: 100
      latency-range-end: 500
      exceptions-active: false
      kill-application-active: false

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    ru.otus.hw: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

app:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8006}
  security:
    jwt-secret-key: ${JWT_SECRET_KEY:}
  internal-api-key: ${INTERNAL_API_KEY}
  rabbitmq:
    user-sync:
      exchange-name: user.sync.events
      queue-name: delivery.profile-sync.queue
      queue-type: classic
      routing-key: user.profile.sync
  delivery:
    default-slots:
      - "10:00-12:00"
      - "12:00-14:00"
      - "14:00-16:00"
      - "16:00-18:00"