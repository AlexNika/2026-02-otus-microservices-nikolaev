# yaml-language-server: $schema=https://json.schemastore.org/spring-configuration-metadata.json
spring:
  profiles:
    active: dev
  application:
    name: NOTIFICATIONService
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL_NOTIFICATION_SERVICE:jdbc:postgresql://localhost:5435/hw07db_notification_service}
    username: ${SPRING_DATASOURCE_USERNAME_NOTIFICATION_SERVICE:hw07user_notification_service}
    password: ${SPRING_DATASOURCE_PASSWORD_NOTIFICATION_SERVICE:hw07pass_notification_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_ADDRESSES:localhost}
    port: 5672
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

server:
  port: ${SERVER_PORT_NOTIFICATION_SERVICE:8003}

springdoc:
  paths-to-match: /api/v1/**

management:
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,rabbitmq
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    ru.otus.hw: DEBUG

app:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8006}
  security:
    jwt-secret-key: ${JWT_SECRET_KEY:}
  internal-api-key: ${INTERNAL_API_KEY}
  rabbitmq:
    exchange-name: notifications.events
    queue-name: notification.queue
    queue-type: classic
    routing-key: notification.event
    consumer-enabled: true
    # Канал USER -> NOTIFICATION: репликация контактов пользователя (UserSyncEvent).
    # notification.profile-sync.queue объявлена с x-dead-letter-exchange=user.sync.events и
    # x-dead-letter-routing-key=user.profile.sync.dlq; ядовитые сообщения уходят в DLQ.
    user-sync:
      exchange-name: user.sync.events
      queue-name: notification.profile-sync.queue
      queue-type: classic
      routing-key: user.profile.sync
# Топология канала уведомлений (RabbitMQConfig / RabbitMQListenerConfig):
#   notification.queue объявлена с x-dead-letter-exchange=notifications.events и
#   x-dead-letter-routing-key=notification.event.dlq; consumer ретраит до 3 попыток
#   с backoff, после исчерпания сообщение уходит в notification.queue.dlq.
#   ВНИМАНИЕ (эксплуатация): RabbitMQ не позволяет менять аргументы существующей очереди —
#   перед деплоем на занятый брокер очередь notification.queue нужно удалить
#   (management UI / rabbitmqctl delete_queue).
