server:
  port: ${SERVER_PORT_ORDER_SERVICE:8002}

spring:
  profiles:
    active: dev
  application:
    name: ORDERService
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL_ORDER_SERVICE:jdbc:postgresql://localhost:5434/hw07db_order_service}
    username: ${SPRING_DATASOURCE_USERNAME_ORDER_SERVICE:hw07user_order_service}
    password: ${SPRING_DATASOURCE_PASSWORD_ORDER_SERVICE:hw07pass_order_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_ADDRESSES:localhost}
    port: 5672
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  http:
    client:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:3s}

# Отказоустойчивость: порядок слоёв Retry( CircuitBreaker( RateLimiter( вызов ) ) ) —
# меньший порядок аспекта = наружнее слой. Классификация ошибок (recordException/
# retryOnException) задана в ResilienceConfig, а не в yaml. TimeLimiter не используется:
# клиенты синхронные (RestClient), таймауты — на spring.http.client.
resilience4j:
  retry:
    retryAspectOrder: 1
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      billingService:
        baseConfig: default
      warehouseService:
        baseConfig: default
      deliveryService:
        baseConfig: default

  circuitbreaker:
    circuitBreakerAspectOrder: 2
    configs:
      default:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      billingService:
        baseConfig: default
      warehouseService:
        baseConfig: default
      deliveryService:
        baseConfig: default

  ratelimiter:
    rateLimiterAspectOrder: 3
    configs:
      default:
        registerHealthIndicator: true
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 1s
    instances:
      billingService:
        baseConfig: default
      warehouseService:
        baseConfig: default
      deliveryService:
        baseConfig: default

management:
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,rabbitmq
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        order.saga.duration: true
        order.saga.step.duration: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        order.saga.duration: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    ru.otus.hw: DEBUG
    org.hibernate.SQL: INFO

app:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8006}
  billing-service-url: ${BILLING_SERVICE_URL:http://localhost:8001}
  warehouse-service-url: ${WAREHOUSE_SERVICE_URL:http://localhost:8004}
  delivery-service-url: ${DELIVERY_SERVICE_URL:http://localhost:8005}
  security:
    jwt-secret-key: ${JWT_SECRET_KEY:}
  internal-api-key: ${INTERNAL_API_KEY}
  idempotency:
    ttl: ${IDEMPOTENCY_KEY_TTL:24h}
    cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:1h}
  outbox:
    publish-delay: ${OUTBOX_PUBLISH_DELAY:1000}
    cleanup-interval: ${OUTBOX_CLEANUP_INTERVAL:1h}
    retention: ${OUTBOX_RETENTION:7d}
  saga:
    recovery:
      stale-after: ${SAGA_RECOVERY_STALE_AFTER:5m}
      interval: ${SAGA_RECOVERY_INTERVAL:60000}
  rabbitmq:
    exchange-name: notifications.events
    queue-name: notification.queue
    queue-type: classic
    routing-key: notification.event
    consumer-enabled: true