apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finalproject.fullname" . }}-rabbitmq-config
  labels:
    {{ include "finalproject.labels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
data:
  # rabbitmq_prometheus (порт 15692, /metrics) — метрики брокера для Prometheus
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finalproject.fullname" . }}-rabbitmq
  labels:
    {{ include "finalproject.labels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Prometheus скрейпит под напрямую по IP (Service для скрейпинга не нужен)
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
            - containerPort: 15692
              name: prometheus
          envFrom:
            - secretRef:
                name: {{ include "finalproject.fullname" . }}-app-secret
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
              readOnly: true
      volumes:
        - name: rabbitmq-config
          configMap:
            name: {{ include "finalproject.fullname" . }}-rabbitmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finalproject.fullname" . }}-rabbitmq
  labels:
    {{ include "finalproject.labels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      protocol: TCP
      name: amqp
    - port: 15672
      targetPort: 15672
      protocol: TCP
      name: management
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
