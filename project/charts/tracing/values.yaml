fullnameOverride: tracing
tempo:
  fullnameOverride: tracing-tempo
  retention: 24h
  persistence:
    enabled: false
  tempo:
    reportingEnabled: false
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
